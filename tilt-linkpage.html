<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TILT | Sulaymaniyah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101d4a;
    --navy-deep:#0a1436;
    --navy-card:#172657;
    --red:#e0332f;
    --red-deep:#b8241f;
    --gold:#f6b81f;
    --cream:#faf5e8;
    --ink:#10131a;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Poppins',sans-serif;
    background:var(--navy-deep);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    position:relative;
    overflow-x:hidden;
  }

  /* Ambient diagonal stripes across the whole page background */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      repeating-linear-gradient(
        135deg,
        transparent 0px,
        transparent 120px,
        rgba(246,184,31,0.035) 120px,
        rgba(246,184,31,0.035) 128px,
        transparent 128px,
        transparent 248px,
        rgba(224,51,47,0.035) 248px,
        rgba(224,51,47,0.035) 256px
      );
    pointer-events:none;
    z-index:0;
  }

  .page{
    width:100%;
    max-width:460px;
    min-height:100vh;
    position:relative;
    z-index:1;
    padding:0 0 48px;
  }

  /* ---------- HERO / SASH ---------- */
  .hero{
    position:relative;
    padding-top:52px;
    padding-bottom:38px;
    text-align:center;
    overflow:hidden;
  }

  .sash{
    position:absolute;
    left:-20%;
    right:-20%;
    top:96px;
    height:64px;
    transform:rotate(-4deg);
    background:linear-gradient(90deg, var(--red-deep) 0%, var(--red) 18%, var(--gold) 50%, var(--red) 82%, var(--red-deep) 100%);
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
    z-index:0;
  }

  .logo-wrap{
    position:relative;
    z-index:2;
    width:172px;
    height:172px;
    margin:0 auto 18px;
    border-radius:50%;
    background:var(--navy-deep);
    padding:6px;
    box-shadow:0 14px 34px rgba(0,0,0,0.45), 0 0 0 3px rgba(246,184,31,0.5);
  }
  .logo-wrap img{
    width:100%;
    height:100%;
    border-radius:50%;
    display:block;
    object-fit:cover;
  }

  .brand-name{
    position:relative;
    z-index:2;
    font-family:'Anton', sans-serif;
    font-size:44px;
    letter-spacing:3px;
    color:var(--cream);
    text-shadow:0 4px 0 rgba(0,0,0,0.25);
  }

  .brand-sub{
    position:relative;
    z-index:2;
    margin-top:8px;
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }

  .status-pill{
    position:relative;
    z-index:2;
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:16px;
    padding:7px 16px;
    border-radius:999px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);
    font-size:12.5px;
    font-weight:500;
    color:var(--cream);
  }
  .status-dot{
    width:8px;height:8px;border-radius:50%;
    background:#38d876;
    box-shadow:0 0 0 3px rgba(56,216,118,0.25);
  }

  /* ---------- LINKS ---------- */
  .links{
    padding:8px 22px 0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    border-radius:16px;
    background:var(--navy-card);
    border:1px solid rgba(255,255,255,0.08);
    text-decoration:none;
    color:var(--cream);
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .link-btn::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:5px;
  }
  .link-btn:active{ transform:scale(0.98); }
  .link-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    border-color:rgba(246,184,31,0.35);
  }

  .link-btn.tiktok::before{ background:var(--gold); }
  .link-btn.instagram::before{ background:var(--red); }
  .link-btn.call::before{ background:var(--gold); }
  .link-btn.map::before{ background:var(--red); }

  .link-icon{
    flex:0 0 auto;
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.06);
  }
  .link-icon svg{ width:22px; height:22px; }

  .link-text{ flex:1; min-width:0; }
  .link-title{
    font-weight:700;
    font-size:15.5px;
    letter-spacing:.2px;
  }
  .link-desc{
    font-size:12.5px;
    color:rgba(250,245,232,0.62);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .link-arrow{
    flex:0 0 auto;
    opacity:.5;
  }

  /* ---------- INFO CARD ---------- */
  .info-card{
    margin:26px 22px 0;
    padding:20px;
    border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.08);
  }

  .info-row{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .info-row + .info-row{
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed rgba(255,255,255,0.1);
  }
  .info-icon{
    flex:0 0 auto;
    width:34px;height:34px;
    border-radius:10px;
    background:rgba(246,184,31,0.12);
    display:flex;align-items:center;justify-content:center;
  }
  .info-icon svg{ width:18px;height:18px; }

  .info-label{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:4px;
  }
  .info-value{
    font-size:14px;
    line-height:1.5;
    color:var(--cream);
  }
  .kurdish{
    font-family:'Vazirmatn', sans-serif;
    direction:rtl;
    font-size:15px;
    font-weight:500;
    display:block;
    margin-top:2px;
  }

  /* ---------- FOOTER ---------- */
  .footer{
    text-align:center;
    margin-top:34px;
    padding:0 22px;
  }
  .footer-stripe{
    height:6px;
    border-radius:6px;
    background:linear-gradient(90deg, var(--red), var(--gold), var(--red));
    margin-bottom:16px;
    opacity:.85;
  }
  .footer-text{
    font-size:11.5px;
    color:rgba(250,245,232,0.4);
    letter-spacing:.5px;
  }

  @media (min-width:600px){
    body{ padding:40px 0; align-items:center; }
    .page{
      min-height:auto;
      border-radius:28px;
      box-shadow:0 30px 80px rgba(0,0,0,0.5);
      background:var(--navy);
      padding-bottom:40px;
    }
  }
</style>
</head>
